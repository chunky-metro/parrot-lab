# parrot-lab phoneme alignment service — Fly.io machine config.
# M3: real Wav2Vec2-XLSR phoneme model + fal-ai/wizper STT.
# Memory bumped to 4GB (model is ~1GB + torch overhead).
# See README.md for `fly volumes create model_cache --size 5` step.
app = "parrot-lab-align"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MODEL_CACHE_DIR = "/app/model_cache"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # min_machines_running = 1 in production once warmed; keep 0 during M3 wiring
  # to avoid burning $$$ on idle while the eval harness is still being built.
  min_machines_running = 0

[[mounts]]
  source = "model_cache"
  destination = "/app/model_cache"

[[vm]]
  # performance-1x = 1 dedicated vCPU; keeps Wav2Vec2 inference predictable.
  # Drop to shared-cpu-2x if cost matters more than p95.
  size = "performance-1x"
  memory = "4096mb"
